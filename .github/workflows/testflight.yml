name: Upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      team_id:
        description: Apple Developer Team ID used for automatic signing
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APPLE_TEAM_ID: ${{ inputs.team_id }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Archive, export, and upload
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::Enter the 10-character Apple Developer Team ID when dispatching this workflow."
            exit 1
          fi

          for variable_name in \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Required repository secret ${variable_name} is not configured."
              exit 1
            fi
          done

          work_directory="$(mktemp -d "${RUNNER_TEMP}/earned-it-testflight.XXXXXX")"
          cleanup() {
            rm -f "${work_directory}/AuthKey.p8"
            rm -rf "$work_directory"
          }
          trap cleanup EXIT

          umask 077
          key_path="${work_directory}/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$key_path"
          chmod 600 "$key_path"

          archive_path="${work_directory}/EarnedIt.xcarchive"
          export_path="${work_directory}/export"
          export_options_path="${work_directory}/ExportOptions.plist"
          build_number="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          cat > "$export_options_path" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          echo "Using $(xcodebuild -version | tr '\n' ' ')"
          echo "Archiving Earned It 1.0 build ${build_number}."
          xcodebuild archive \
            -project EarnedIt.xcodeproj \
            -scheme EarnedIt \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$build_number" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -quiet \
            -showBuildTimingSummary

          echo "Exporting the App Store Connect IPA."
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -quiet

          ipa_path="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "::error::Xcode export completed without producing an IPA."
            exit 1
          fi

          echo "Uploading the IPA to App Store Connect for TestFlight processing."
          xcrun altool --upload-app \
            -f "$ipa_path" \
            --api-key "$APP_STORE_CONNECT_API_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --p8-file-path "$key_path"
